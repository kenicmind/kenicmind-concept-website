<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090d">
<title>Kenicmind Hub V9</title>
<style>html,body{margin:0;background:#09090d;color:#fff;font-family:system-ui}#boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.dot{width:44px;height:44px;border:4px solid #302440;border-top-color:#ffc84a;border-radius:50%;animation:s .8s linear infinite;margin:auto}@keyframes s{to{transform:rotate(360deg)}}</style>
<div id="boot"><div><div class="dot"></div><p>Opening Kenicmind Hub V9…</p></div></div>
<script>
(async()=>{
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  async function getPart(f){
    let err;
    for(let attempt=1;attempt<=6;attempt++){
      try{
        const r=await fetch('./'+f+'?v=9.1&a='+attempt+'&t='+Date.now(),{cache:'no-store'});
        if(r.ok)return await r.text();
        err=new Error(f+' '+r.status);
      }catch(e){err=e}
      await sleep(500*attempt);
    }
    throw err||new Error(f+' unavailable');
  }
  try{
    const files=["v9-1.txt","v9-2.txt","v9-3.txt","v9-4.txt","v9-5.txt"];
    const parts=[];
    for(const f of files) parts.push(await getPart(f));
    const bin=atob(parts.join('').trim()),bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    const ds=new DecompressionStream('gzip');
    const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('boot').innerHTML='<div><h2>Kenicmind Hub V9 could not start</h2><p>Please tap refresh once. The app will retry automatically.</p><small>'+String(e)+'</small></div>';
  }
})();
</script>
