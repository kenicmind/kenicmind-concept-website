<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09080d">
<title>Kenicmind Hub</title>
<style>html,body{margin:0;background:#09080d;color:#fff;font-family:system-ui}#boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.dot{width:44px;height:44px;border:4px solid #302440;border-top-color:#ffc84a;border-radius:50%;animation:s .8s linear infinite;margin:auto}@keyframes s{to{transform:rotate(360deg)}}</style>
<div id="boot"><div><div class="dot"></div><p>Opening Kenicmind Hub…</p></div></div>
<script>
(async()=>{
 try{
  const files=['live1.txt','live2.txt','live3.txt','live4.txt'];
  const parts=await Promise.all(files.map(f=>fetch('./'+f,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(f+' '+r.status);return r.text()})));
  const bin=atob(parts.join('').trim()), bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  const html=new TextDecoder().decode(bytes);
  document.open();document.write(html);document.close();
 }catch(e){
  document.getElementById('boot').innerHTML='<div><h2>Kenicmind Hub could not start</h2><p>Refresh this page in Safari.</p><small>'+String(e)+'</small></div>';
 }
})();
</script>
